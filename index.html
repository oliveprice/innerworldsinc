<script>
  const lenis = new Lenis({
    duration: 1.2,
    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t))
  });

  function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
  }

  requestAnimationFrame(raf);
</script>

<iframe id="preload-frame" src="home.html" style="display:none;"></iframe>

<script>
  const iframe = document.getElementById("preload-frame");

  function fullyLoaded() {
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    const el = doc.querySelector('.background-layer-3');

    if (el && getComputedStyle(el).opacity === "1") {
      window.location.href = "home.html";
    } else {
      setTimeout(fullyLoaded, 100);
    }
  }

  iframe.onload = () => {
    setTimeout(fullyLoaded, 200);
  };
</script>
