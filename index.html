<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Inner Worlds — Loading</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
  <meta name="description" content="UX Engineer Olive Price showcases her sites, games, writings, and graphic design series, all personally crafted with original code, illustrations, and hand-drawn animations.">
  <link rel="icon" type="image/png" href="./resources/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="preload" href="./resources/css/style.css" as="style">
  <link rel="preload" href="./resources/images/assets_together_2.webp" as="image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #674f67; overflow: hidden; }
    .screen-container {
      position: fixed; inset: 0; display:flex; align-items:center; justify-content:center;
      background: #674f67 url('./resources/images/pink-paper-cover.webp') center / auto 375vh repeat;
    }
    .lottie-wrapper { width: 100vw; height: 100vh; }
    .fade-out { animation: fadeOut .35s ease forwards; }
    @keyframes fadeOut { to { opacity: 0; } }
  </style>
</head>

<body>
  <div class="screen-container">
    <div id="open-screen-animation" class="lottie-wrapper"></div>
  </div>

  <!-- Only the lib needed to show the opening animation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.0/lottie.min.js"></script>
  <script>
    (function(){
      const el = document.getElementById('open-screen-animation');
      if (!el || !window.lottie) return;
      try {
        window.__loaderAnim = lottie.loadAnimation({
          container: el, renderer: 'svg', loop: true, autoplay: true,
          rendererSettings: { preserveAspectRatio: 'xMidYMid slice' },
          path: './resources/animations/open-screen/data.json'
        });
      } catch (e) {}
    })();
  </script>

  <!-- Hidden preloader iframe (puts home.html assets into cache without booting heavy JS) -->
  <iframe id="preload-frame" src="home.html?preload=1" style="position:fixed; inset:0; width:100%; height:100%; border:0; visibility:hidden; pointer-events:none; z-index:-1;" aria-hidden="true" tabindex="-1"></iframe>

  <script>
    const iframe = document.getElementById('preload-frame');

    // Safety fallback if "ready" never arrives
    const FAILSAFE_MS = 20000;
    const failsafe = setTimeout(() => jump(), FAILSAFE_MS);
    const MIN_MS = 3000;
    const startedAt = performance.now();

    window.addEventListener('message', (e) => {
      try {
        if (e.source === iframe.contentWindow && e.data && e.data.type === 'HOME_READY') {
          clearTimeout(failsafe);
          setTimeout(jump, Math.max(0, MIN_MS - (performance.now() - startedAt)));
        }
      } catch (_) {}
    }, false);

    function jump(){
      document.body.classList.add('fade-out');
      setTimeout(() => {
        // replace() avoids adding the loader to browser history
        window.location.replace('home.html');
      }, 200);
    }
  </script>
</body>
</html>
