<script>
(() => {
  // Grab the existing modal and key bits
  const modal = document.getElementById('change-log-modal');
  if (!modal) { console.warn('Missing #change-log-modal'); return; }

  const closeBtn = modal.querySelector('.close-button');
  const content = modal.querySelector('.commit-container');
  const originalHTML = content ? content.innerHTML : "";

  // Open the modal with a temporary "no access" message
  function openAccessGate(msg) {
    if (content) {
      content.innerHTML = `
        <div class="access-gate" style="text-align:center; padding: 1.25rem;">
          <h3 style="margin:0 0 .5rem 0;">You do not currently have access to this page.</h3>
          ${msg ? `<p style="margin:0; opacity:.8;">${msg}</p>` : ""}
        </div>`;
    }
    modal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    closeBtn?.focus();
  }

  // Restore original modal state
  function closeAccessGate() {
    modal.classList.add('hidden');
    if (content) content.innerHTML = originalHTML;
    document.body.style.overflow = '';
  }

  // Close handlers
  closeBtn?.addEventListener('click', closeAccessGate);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeAccessGate(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeAccessGate();
  });

  // ---- Gate all clicks inside the "series chapter" area ----
  // Adjust these selectors to match your markup if needed.
  const seriesSections = document.querySelectorAll(
    '.series-chapter, .series .chapter, .chapters .chapter'
  );

  seriesSections.forEach(section => {
    // Use capture so we intercept before navigation
    section.addEventListener('click', (e) => {
      // Ignore clicks that originate inside the modal itself
      if (modal.contains(e.target)) return;

      // Only trigger on typical interactive/“card” targets
      const clickable = e.target.closest('a, button, [role="button"], [data-clickable], .clickable, .card, li, .chapter-tile');
      if (!clickable) return;

      e.preventDefault();
      e.stopPropagation();
      openAccessGate(); // optional: pass a string for extra context
    }, true);
  });

  // ---- Optional: mark specific elements anywhere to require access ----
  document.querySelectorAll('[data-requires-access]').forEach(el => {
    el.addEventListener('click', (e) => { e.preventDefault(); openAccessGate(); });
  });
})();
</script>



<iframe id="preload-frame" src="home.html" style="display:none;"></iframe>

<script>
  const iframe = document.getElementById("preload-frame");

  function fullyLoaded() {
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    const el = doc.querySelector('.background-layer-3');

    if (el && getComputedStyle(el).opacity === "1") {
      window.location.href = "home.html";
    } else {
      setTimeout(fullyLoaded, 100);
    }
  }

  iframe.onload = () => {
    setTimeout(fullyLoaded, 200);
  };
</script>
