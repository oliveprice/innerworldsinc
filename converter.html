<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hiccup Shorthand Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
   <meta name="description" content="Convert HTML into shorthand hiccup syntax in your browser." />
  <link rel="icon" href="/favicon.ico" />

  <style>
    :root{
      --bg: #0b0c0f;
      --panel: #12141a;
      --panel-2: #0f1116;
      --text: #e8e8ea;
      --muted: #9aa0a6;
      --accent: #6ee7ff;
      --border: #1e2230;
      --radius: 14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    }

    /* page */
    html, body{
      height: 100%;
      background:
        radial-gradient(1200px 1200px at 80% -10%, rgba(124,58,237,.15), transparent 60%),
        radial-gradient(1000px 1000px at -10% 110%, rgba(110,231,255,.10), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      margin: 0;
    }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }

    header.page{
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand{
      font-weight: 700;
      letter-spacing: .3px;
      font-size: 18px;
      opacity: .95;
    }
    .sub{
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar{
      display: flex;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      padding: 10px;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      position: sticky;
      top: 12px;
      z-index: 2;
    }
    .tool-spacer{ flex: 1 1 auto; }

    .btn{
      appearance: none;
      border: 1px solid var(--border);
      background: #0d1016;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: transform .06s ease, border-color .15s ease, box-shadow .15s ease;
      user-select: none;
    }
    .btn:hover{ border-color: #2a3145; }
    .btn:active{ transform: translateY(1px) scale(.99); }
    .btn.primary{
      background: linear-gradient(180deg, #111729, #0f1422);
      border-color: #2a3145;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 4px 16px rgba(37, 99, 235, .25);
    }

    .grid{
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
    }

    .panel{
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
      min-height: 320px;
    }

    .panel header{
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      margin: 0; /* override */
      background: rgba(255,255,255,.01);
      border-bottom: 1px solid var(--border);
    }
    .panel h2{
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2px;
      margin: 0;
      color: var(--muted);
      text-transform: uppercase;
    }
    .slot{
      position: relative;
      padding: 10px;
    }

    /* editor areas */
    .code{
      width: 100%;
      height: 100%;
      min-height: 280px;
      resize: vertical;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.5;
      color: #e9ecf1;
      background: #0b0f17;
      border: 1px solid #1b2130;
      border-radius: 10px;
      padding: 12px;
      outline: none;
      box-shadow: inset 0 8px 30px rgba(0,0,0,.35);
      caret-color: var(--accent);
      tab-size: 2;
      white-space: pre;
      overflow: auto;
    }
    .code:focus{
      border-color: #2a3145;
      box-shadow: inset 0 8px 30px rgba(0,0,0,.35), 0 0 0 3px rgba(110,231,255,.18);
    }
    .readonly{
      background: #0a0d14;
    }

    .hint{
      position: absolute;
      bottom: 14px;
      right: 14px;
      font-size: 12px;
      color: var(--muted);
      opacity: .9;
      user-select: none;
    }

    footer.page{
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      opacity: .9;
    }
    .kbd{
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--mono);
      background: #0d1016;
      font-size: 11px;
      vertical-align: baseline;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page" aria-label="Header">
      <div>
        <div class="brand">hiccup shorthand</div>
        <div class="sub">convert longhand → shorthand (client-side)</div>
      </div>
    </header>

    <div class="toolbar" role="toolbar" aria-label="Actions">
      <button class="btn primary" id="convert-btn" aria-label="Convert">Convert</button>
      <button class="btn" id="copy-output-btn" aria-label="Copy output">Copy output</button>
      <button class="btn" id="clear-btn" aria-label="Clear">Clear</button>
      <div class="tool-spacer"></div>
      <span class="sub">all in-browser · no uploads</span>
    </div>

    <main class="grid" aria-label="Editor panels">
      <!-- INPUT -->
      <section class="panel" aria-labelledby="input-title">
        <header>
          <h2 id="input-title">Input — longhand hiccup</h2>
        </header>
        <div class="slot">
          <textarea class="code" id="input" spellcheck="false" aria-label="Input textarea" placeholder="paste longhand hiccup here, e.g.

[:div {:id &quot;hero&quot; :class [&quot;banner&quot; &quot;primary&quot;]}
  [:h1 {:class &quot;title&quot;} &quot;Hello&quot;]
  [:p {:class &quot;lead&quot;} &quot;Some copy&quot;]]"></textarea>
          <div class="hint">paste or type → press <span class="kbd">Convert</span></div>
        </div>
      </section>

      <!-- OUTPUT -->
      <section class="panel" aria-labelledby="output-title">
        <header>
          <h2 id="output-title">Output — shorthand hiccup</h2>
        </header>
        <div class="slot">
          <textarea class="code readonly" id="output" spellcheck="false" aria-label="Output textarea" readonly placeholder="output will appear here, e.g.

[:div#hero.banner.primary
  [:h1.title &quot;Hello&quot;]
  [:p.lead &quot;Some copy&quot;]]"></textarea>
          <div class="hint">read-only</div>
        </div>
      </section>
    </main>

    <footer class="page" aria-label="Footer">
      tip: keep your cursor inside the input and press <span class="kbd">Cmd</span>+<span class="kbd">Enter</span> (or <span class="kbd">Ctrl</span>+<span class="kbd">Enter</span>) to convert.
    </footer>
  </div>

  <!-- script hooks come later -->
<script>
// --- HTML -> (longhand) Hiccup AST -------------------------

const VOID_TAGS = new Set([
  "area","base","br","col","embed","hr","img","input",
  "link","meta","param","source","track","wbr"
]);

function attrKey(name) {
  // html attr -> EDN keyword string like ":href", ":data-foo"
  // keep lowercase, kebab-case
  return ":" + name.replace(/([A-Z])/g, "-$1").toLowerCase();
}

function collectAttrs(el) {
  const m = {};
  for (const a of el.attributes) {
    const k = attrKey(a.name);
    if (k === ":class") {
      // normalize class into space-separated string (your transformer handles string or vector)
      if (a.value && a.value.trim()) m[":class"] = a.value.trim();
    } else if (k === ":id") {
      if (a.value && a.value.trim()) m[":id"] = a.value.trim();
    } else if (k === ":style") {
      // keep style as the raw CSS string; your transformer will leave it as string
      if (a.value && a.value.trim()) m[":style"] = a.value.trim();
    } else {
      // boolean-ish: HTML may give empty string for presence-only attributes
      m[k] = a.value === "" ? true : a.value;
    }
  }
  return m;
}

function nodeToHiccup(node) {
  switch (node.nodeType) {
    case Node.ELEMENT_NODE: {
      const tag = ":" + node.tagName.toLowerCase();
      const attrs = collectAttrs(node);

      // if classList/id missing as attributes but present on DOM, include them
      if (!attrs[":class"] && node.classList?.length) {
        attrs[":class"] = Array.from(node.classList).join(" ");
      }
      if (!attrs[":id"] && node.id) {
        attrs[":id"] = node.id;
      }

      // children
      const kids = [];
      if (!VOID_TAGS.has(node.tagName.toLowerCase())) {
        node.childNodes.forEach((ch) => {
          const k = nodeToHiccup(ch);
          if (k != null) kids.push(k);
        });
      }

      // build longhand hiccup vector: [:tag {:attrs ...} ...kids]
      const kw = { __kw: tag };
      return Object.keys(attrs).length ? [kw, attrs, ...kids] : [kw, ...kids];
    }

    case Node.TEXT_NODE: {
      // keep non-whitespace text nodes
      const t = node.nodeValue;
      if (t && t.replace(/\s+/g, " ").trim() !== "") {
        return t;
      }
      return null;
    }

    case Node.COMMENT_NODE:
      return null;

    default:
      return null;
  }
}

function htmlToHiccupAst(html) {
  // Parse as a fragment so we can handle snippets (not full HTML docs)
  const doc = new DOMParser().parseFromString(html, "text/html");
  const body = doc.body;

  const items = [];
  body.childNodes.forEach((n) => {
    const h = nodeToHiccup(n);
    if (h != null) items.push(h);
  });

  // If there is exactly one root, return that vector; else return a generic vector of roots.
  return items.length === 1 ? items[0] : items;
}

// --- end HTML -> Hiccup
</script>
<script>
/* ===========================
   HICCUP SHORTHAND CONVERTER
   ===========================
   No deps. Parses a useful subset of EDN/Hiccup:
   - Vectors: [ ... ]
   - Maps:    { :k v, "k" v, ... }
   - Keywords: :kw, :ns/kw
   - Strings:  "..."
   - Numbers, booleans, nil
   - Comments: ; ... (line)
   This is intentionally small but robust for typical Hiccup.
*/

/* ---------- utils ---------- */
const el = (id) => document.getElementById(id);
const isWS = (ch) => ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r';
const isDigit = (ch) => ch >= '0' && ch <= '9';
const isIdentStart = (ch) => /[A-Za-z_*+\-!?<>/=.$]/.test(ch);
const isIdent = (ch) => /[A-Za-z0-9_*+\-!?<>/=.$]/.test(ch);

function die(msg, at) {
  const where = at != null ? ` at position ${at}` : '';
  throw new Error(`${msg}${where}`);
}

/* ---------- tokenizer ---------- */
function tokenize(src) {
  const toks = [];
  let i = 0;
  const len = src.length;

  const push = (type, value) => toks.push({ type, value, i });

  while (i < len) {
    const ch = src[i];

    // skip whitespace
    if (isWS(ch)) { i++; continue; }

    // comments ; ... to EOL
    if (ch === ';') {
      while (i < len && src[i] !== '\n') i++;
      continue;
    }

    // delimiters
    if (ch === '[' || ch === ']' || ch === '{' || ch === '}' ) {
      push('delim', ch); i++; continue;
    }

    // string
    if (ch === '"') {
      let s = ''; i++; // skip opening "
      while (i < len) {
        const c = src[i++];
        if (c === '"') break;
        if (c === '\\') {
          if (i >= len) die('Unterminated string escape', i);
          const esc = src[i++];
          const map = { 'n':'\n', 'r':'\r', 't':'\t', '"':'"', '\\':'\\' };
          s += map[esc] ?? esc;
        } else {
          s += c;
        }
      }
      push('string', s);
      continue;
    }

    // keyword :abc or :ns/kw
    if (ch === ':') {
      let s = ':'; i++;
      while (i < len && isIdent(src[i])) s += src[i++];
      push('keyword', s);
      continue;
    }

    // number (int/float) (naive but fine)
    if (isDigit(ch) || (ch === '-' && isDigit(src[i+1]))) {
      let s = src[i++], seenDot = false;
      while (i < len) {
        const c = src[i];
        if (isDigit(c)) { s += c; i++; continue; }
        if (c === '.' && !seenDot) { seenDot = true; s += c; i++; continue; }
        break;
      }
      push('number', s);
      continue;
    }

    // symbols/idents (true false nil, or tag names etc.)
    if (isIdentStart(ch)) {
      let s = src[i++];
      while (i < len && isIdent(src[i])) s += src[i++];
      push('symbol', s);
      continue;
    }

    // commas are whitespace in EDN
    if (ch === ',') { i++; continue; }

    die(`Unexpected character '${ch}'`, i);
  }

  return toks;
}

/* ---------- recursive descent parser ---------- */
function parse(src) {
  const tks = tokenize(src);
  let p = 0;

  const peek = () => tks[p] || null;
  const take = () => tks[p++] || null;
  const want = (type, value) => {
    const t = take();
    if (!t || t.type !== type || (value != null && t.value !== value)) {
      die(`Expected ${type}${value?` '${value}'`:''}`, t?.i);
    }
    return t;
  };

  function parseValue() {
    const t = peek();
    if (!t) die('Unexpected EOF');

    if (t.type === 'delim') {
      if (t.value === '[') return parseVector();
      if (t.value === '{') return parseMap();
      die(`Unexpected delimiter '${t.value}'`, t.i);
    }
    if (t.type === 'string') { take(); return t.value; }
    if (t.type === 'number') { take(); return Number(t.value); }
    if (t.type === 'keyword') { take(); return { __kw: t.value }; }
    if (t.type === 'symbol') {
      take();
      if (t.value === 'nil') return null;
      if (t.value === 'true') return true;
      if (t.value === 'false') return false;
      // treat other symbols as plain strings (e.g., tag names if ever needed)
      return { __sym: t.value };
    }

    die(`Unexpected token '${t.type}'`, t.i);
  }

  function parseVector() {
    want('delim', '[');
    const arr = [];
    while (true) {
      const t = peek();
      if (!t) die('Unterminated vector');
      if (t.type === 'delim' && t.value === ']') { take(); break; }
      arr.push(parseValue());
    }
    return arr;
  }

  function parseMap() {
    want('delim', '{');
    const m = {};
    while (true) {
      const t = peek();
      if (!t) die('Unterminated map');
      if (t.type === 'delim' && t.value === '}') { take(); break; }
      const k = parseValue();
      const v = parseValue();
      m[keyToString(k)] = v;
    }
    return m;
  }

  function keyToString(k) {
    if (k && typeof k === 'object' && k.__kw) return k.__kw; // already like ":id"
    if (typeof k === 'string') return k;
    if (k && k.__sym) return k.__sym;
    return String(k);
  }

  // allow multiple top-level forms; if 1, return it; if many, return as vector of forms
  const forms = [];
  while (p < tks.length) forms.push(parseValue());
  return forms.length === 1 ? forms[0] : forms;
}

/* ---------- transformer: longhand → shorthand ---------- */
function isKeyword(x, name) {
  return x && typeof x === 'object' && x.__kw === name;
}
function kwName(kw) { // ":div", ":ns/kw" -> "div" or "ns/kw"
  return kw?.__kw?.slice(1) ?? '';
}
function ensureKeywordTag(tagStr) { return { __kw: ':' + tagStr }; }
function isPlainObj(o){ return o && typeof o === 'object' && !Array.isArray(o) && !o.__kw && !o.__sym; }

function classesFrom(val) {
  if (!val) return [];
  if (typeof val === 'string') return val.trim().split(/\s+/).filter(Boolean);
  if (Array.isArray(val)) {
    return val.map(v => typeof v === 'string' ? v
             : (v && v.__kw ? kwName(v) : String(v)))
             .flatMap(s => s.split(/\s+/))
             .filter(Boolean);
  }
  return [];
}

function mergeIdClassIntoTag(tagKw, attrs) {
  const raw = kwName(tagKw); // may be "div", or "div#x.a.b"
  let base = raw, idPart = '', clsPart = [];

  // parse existing shorthand bits on the tag, if any
  const m = raw.match(/^([^#.]+)(?:#([^.#]+))?(?:\.(.+))?$/);
  if (m) {
    base = m[1] || 'div';
    if (m[2]) idPart = m[2];
    if (m[3]) clsPart = m[3].split('.');
  }

  // lift from attrs
  const idFromAttrs = attrs[":id"];
  if (idFromAttrs && !idPart) idPart = String(idFromAttrs);

  const clsFromAttrs = classesFrom(attrs[":class"]);
  const mergedClasses = Array.from(new Set([...clsPart, ...clsFromAttrs]));

  // strip lifted keys
  const rest = { ...attrs };
  delete rest[":id"];
  delete rest[":class"];

  const tagStr =
    base +
    (idPart ? ('#' + idPart) : '') +
    (mergedClasses.length ? ('.' + mergedClasses.join('.')) : '');

  return [ensureKeywordTag(tagStr), rest];
}

function toKebab(s) {
  // handles :fontSize -> "font-size", :background-color -> "background-color"
  return String(s)
    .replace(/^:/,'')
    .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
    .replace(/_/g,'-')
    .toLowerCase();
}

function styleMapToString(v){
  if (!isPlainObj(v)) return v; // already a string or something else
  const parts = [];
  for (const [k, val] of Object.entries(v)) {
    const keyStr = k.startsWith(':') ? toKebab(k) : toKebab(k);
    const valStr = typeof val === 'string' ? val : String(val);
    parts.push(`${keyStr}: ${valStr};`);
  }
  return parts.join(' ');
}

function transform(node) {
  // vectors are Hiccup nodes; everything else pass-through
  if (Array.isArray(node) && node.length) {
    // [:tag maybe-attrs & children]
    const [t0, t1, ...restKids] = node;

    // tag must be a keyword like {:__kw:":div..."}
    const tagKw = (t0 && t0.__kw) ? t0 : (typeof t0 === 'string' && t0.startsWith(':') ? {__kw:t0} : t0);
    if (!tagKw || !tagKw.__kw) {
      // Not a standard element vector; transform children anyway
      return node.map(transform);
    }

    let attrs = {};
    let kids = restKids;

    if (isPlainObj(t1)) {
      attrs = t1;
    } else {
      kids = [t1, ...restKids].filter(v => v !== undefined);
    }

    // lift id/class to tag
    let [newTag, newAttrs] = mergeIdClassIntoTag(tagKw, attrs);

    // style map → string
    if (newAttrs[":style"]) {
      newAttrs[":style"] = styleMapToString(newAttrs[":style"]);
    }

    // drop empty attrs map
    const attrsOut = Object.keys(newAttrs).length ? newAttrs : null;

    // transform children
    const kidsOut = (kids || []).map(transform);

    return attrsOut ? [newTag, attrsOut, ...kidsOut] : [newTag, ...kidsOut];
  }

  // maps inside children: still walk style maps etc.
  if (isPlainObj(node)) {
    const out = {};
    for (const [k,v] of Object.entries(node)) {
      out[k] = (k === ":style") ? styleMapToString(v) : transform(v);
    }
    return out;
  }

  // scalars, strings, keywords-as-objects untouched
  return node;
}

/* ---------- pretty-printer ---------- */
function pp(node, indent = 0, topLevel = true) {
  const pad = (n) => '  '.repeat(n);

  if (node && typeof node === 'object') {
    if (node.__kw) return node.__kw;
    if (node.__sym) return node.__sym;
  }

  if (Array.isArray(node)) {
    if (node.length === 0) return "[]";

    const [first, ...rest] = node;
    const firstStr = pp(first, indent + 1, false);

    // if tag vector
    if (first && first.__kw) {
      let out = "[:"
        + firstStr.slice(1); // drop the ":" already included
      if (rest.length) {
        out += "\n" + rest.map(n => pad(indent + 1) + pp(n, indent + 1, false)).join("\n");
        out += "]"; // close immediately, no newline
      } else {
        out += "]"; // self-closing
      }
      return out;
    } else {
      // generic vector
      const inner = node.map(n => pp(n, indent + 1, false));
      return "[" + inner.join(" ") + "]";
    }
  }

  if (isPlainObj(node)) {
    const entries = Object.entries(node);
    if (entries.length === 0) return "{}";
    return "{ " + entries.map(([k, v]) => `${k} ${pp(v, indent + 1, false)}`).join(" ") + " }";
  }

  if (typeof node === "string") {
    if (node.startsWith(":") && node.indexOf(" ") === -1) return node;
    return JSON.stringify(node);
  }

  if (node === null) return "nil";
  if (typeof node === "number") return String(node);
  if (typeof node === "boolean") return node ? "true" : "false";

  return String(node);
}



/* ---------- glue: UI handlers ---------- */
function looksLikeHTML(s) {
  // quick heuristic: starts with "<tag" or contains closing ">" early on
  const trimmed = s.trim();
  return trimmed.startsWith("<") && /<\s*[A-Za-z]/.test(trimmed);
}

function convertNow() {
  const input = el('input').value;
  const outEl = el('output');

  if (!input.trim()) { outEl.value = ''; return; }

  try {
    let ast;

    if (looksLikeHTML(input)) {
      // HTML -> longhand Hiccup AST
      const longhandAst = htmlToHiccupAst(input);
      // Then reuse your existing transformer to make shorthand
      ast = transform(longhandAst);
    } else {
      // already hiccup/edn -> shorthand
      const parsed = parse(input);
      ast = transform(parsed);
    }

    const printed = pp(ast, 0);
    outEl.value = printed;
  } catch (err) {
    outEl.value =
`;; Parse/convert error:
;; ${err.message}

;; If you're pasting HTML, make sure it's valid markup.
;; If you're pasting Hiccup, ensure it's valid EDN/Hiccup vectors.
`;
    console.error(err);
  }
}



function copyOutput() {
  const v = el('output').value;
  if (!v) return;
  navigator.clipboard.writeText(v).then(() => {
    flashButton('copy-output-btn');
  });
}

function clearAll() {
  el('input').value = '';
  el('output').value = '';
  flashButton('clear-btn');
}

function flashButton(id){
  const b = el(id);
  if (!b) return;
  b.style.boxShadow = '0 0 0 3px rgba(110,231,255,.25)';
  setTimeout(()=> b.style.boxShadow = '', 180);
}

/* keyboard shortcut: Cmd/Ctrl + Enter */
document.addEventListener('keydown', (e) => {
  const meta = e.metaKey || e.ctrlKey;
  if (meta && e.key === 'Enter') {
    e.preventDefault();
    convertNow();
  }
});

/* hook up buttons (if present) */
(() => {
  const btnConvert = el('convert-btn');
  const btnCopy = el('copy-output-btn');
  const btnClear = el('clear-btn');

  btnConvert && btnConvert.addEventListener('click', convertNow);
  btnCopy && btnCopy.addEventListener('click', copyOutput);
  btnClear && btnClear.addEventListener('click', clearAll);
})();
</script>

</body>
</html>
