<script>
  (async function(){
    if (!window.__PRELOAD_ONLY__) return;


    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch(_) {}

    const explicitImgs = [
      './resources/images/assets_together_2.webp'

    ];

    const bgSelectors = [
      'body', '.background-layer-1', '.background-layer-2', '.background-layer-3',
      '.hero-section-frame', '.hero-section', '.toc-frame', '.footer-frame'
    ];

    function extractBgUrl(el){
      const bg = getComputedStyle(el).backgroundImage || '';
      const m = bg.match(/url\(["']?([^"')]+)["']?\)/);
      return m ? m[1] : null;
    }

    const discovered = [];
    bgSelectors.forEach(sel => {
      document.querySelectorAll(sel).forEach(el => {
        const u = extractBgUrl(el);
        if (u) discovered.push(u);
      });
    });

    const toLoad = Array.from(new Set([...explicitImgs, ...discovered].filter(Boolean)));
    await Promise.all(toLoad.map(src => new Promise((res) => {
      const img = new Image();
      img.onload = img.onerror = () => res();
      img.src = src;
    })));


    const warm = [
      'https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.0/lottie.min.js',
      'https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js'

    ];
    await Promise.all(warm.map(src => new Promise((res)=>{
      const link = document.createElement('link');
      link.rel = 'preload'; link.as = 'script'; link.href = src;
      link.onload = link.onerror = () => res();
      document.head.appendChild(link);
    })));

    // 4) Signal ready to the loader
    try { window.top.postMessage({ type: 'HOME_READY' }, '*'); } catch(_) {}
  })();
</script>

<script>
(function () {
  const el = document.querySelector('.background-layer-3');
  if (!el) return;

  const STORAGE_KEY = 'IW_home_faded_v1';

  function lockEndState() {
    el.classList.remove('fade-in');
    el.style.animation = 'none';
    el.style.opacity = '1';
    el.style.transform = 'none';
  }

  const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
  const alreadyFadedThisTab = sessionStorage.getItem(STORAGE_KEY) === '1';
  const isReload = nav && nav.type === 'reload';
  const isFirstNavigateThisTab = nav && nav.type === 'navigate' && !alreadyFadedThisTab;


  const shouldAnimate = isReload || isFirstNavigateThisTab;

  if (shouldAnimate) {
    el.classList.add('fade-in');

    sessionStorage.setItem(STORAGE_KEY, '1');
    el.addEventListener('animationend', () => {
      el.classList.remove('fade-in');
    }, { once: true });
  } else {
    lockEndState();
  }


  window.addEventListener('pageshow', (e) => {
    if (e.persisted) lockEndState();
  });


  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && alreadyFadedThisTab) {
      lockEndState();
    }
  });
})();
</script>
