<!DOCTYPE html>
<html>
   <head>
      <title>Inner Worlds Inc.</title>
      <meta name="viewport" content="width=1280, user-scalable=yes">
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
      <link rel="icon" href="./resources/favicon/favicon-32x32.png"> 
      <link rel="preload" as="image" href="./resources/images/assets_together_2.webp" type="image/webp">
      <link rel="stylesheet" href="./resources/css/style.css" />
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <script src="https://kit.fontawesome.com/cf45e25b55.js" crossorigin="anonymous"></script>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Spectral:wght@200&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="https://use.typekit.net/ffd3aqy.css">
      <link rel="stylesheet" href="https://use.typekit.net/ffd3aqy.css">

      <script src="https://cdn.jsdelivr.net/npm/smooth-scrollbar@8.7.4/dist/smooth-scrollbar.js"></script>
      <script src="https://unpkg.com/@studio-freight/lenis@1.0.35/bundled/lenis.min.js"></script>
   </head>
   <body class="background-layer-1">
<ul class="tabs" id="site-tabs"></ul>

      <div id="my-scrollbar" class="background-layer-2">
         <div class="background-layer-3 fade-in">
            <div class="flex-column flex-align-center">
               <div class="video-container">
                  <div id="angel-lottie" class="angel-video"></div>
               </div>
               <div class="hero-section-frame margin-top-180 margin-bottom-240">
                  <div class="hero-section " id="lottie-hero">
                     <div id="opener" class="opener"></div>
                  </div>
               </div>
               <div class="octo-container">
                 <div id="octo-placeholder" class="octo-video"></div>
               </div>
               <div class="toc-frame">
                 <div class="flex-justify-center inset-plus-8">
                   <div id="chapters-wrapper" class="flex-column flex-align-start gap-plus-4"></div>
                 </div>
               </div>
               <div class="mermaid-container right">
                 <div id="mermaid-lottie" class="mermaid-video"></div>
               </div>

               <div class="footer-frame">
                  <div class="links flex-row flex-justify-center offset-margin-top flex-align-center gap-plus-1">
                     <!-- About Me Link -->
                     <div class="link-container">
                        <img src="./resources/drawn_typography/about me.png" alt="About Me" class="footer-link">
                        <div id="underline-about-me" class="underline-animation"></div>
                     </div>
                     <!-- Colophon Link -->
                     <div class="link-container">
                        <img src="./resources/drawn_typography/colophon.png" alt="Colophon" class="footer-link">
                        <div id="underline-colophon" class="underline-animation"></div>
                     </div>
                     <!-- Change Log Link -->
                     <div class="link-container">
                        <img src="./resources/drawn_typography/change log.png" alt="Change Log" class="footer-link">
                        <div id="underline-change-log" class="underline-animation"></div>
                     </div>
                  </div>
               </div>

               <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.35/dist/lenis.min.js"></script>
               <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.0/lottie.min.js"></script>
            </div>
         </div>
      </div>
      </div>

      <script src="dist/smooth-scrollbar.js"></script>
      <script>
        Scrollbar.init(document.querySelector('#my-scrollbar'), {
          damping: 0.12,
          renderByPixels: true,
          alwaysShowTracks: true
        });
      </script>

      <!-- Chapters + site scripts -->
      <script src="./scripts/chapters-animation-2.js"></script>
      <script src="./scripts/hover.js"></script>
      <script src="./scripts/tabs.js"></script>
      <script src="./scripts/load.js"></script>
      <script src="./scripts/opener.js"></script>
      <script src="./scripts/moving-parts.js"></script>

      <!-- Change Log modal: INLINE so it's present on first click -->
      <div id="change-log-container">
        <div id="change-log-modal" class="modal hidden">
          <div class="modal-content">
            <div class="modal-layer-1">
              <span class="close-button">&times;</span>
              <div class="hero-section-frame small">
                <div class="commit-container">
                  <!-- change-log.js can still populate here if it wants -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Keep your existing JS (it can add content/listeners to the modal if needed) -->
      <script src="./scripts/change-log.js"></script>

      <!-- Other modals -->
      <div id="about-me-container"></div>
      <script src="./scripts/about-me.js"></script>
      <div id="colophon-container"></div>
      <script src="./scripts/colophon-modal.js"></script>

      <!-- Firebase (unchanged) -->
      <script type="module">
         import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
         import { getFirestore, collection, addDoc, getDocs, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
         
         const firebaseConfig = {
           apiKey: "AIzaSyB5GY0wS3a4vmDIECJnvnDs4xEL0AE0v9w",
           authDomain: "innerworldsguestbook.firebaseapp.com",
           projectId: "innerworldsguestbook",
           storageBucket: "innerworldsguestbook.firebasestorage.app",
           messagingSenderId: "78775217030",
           appId: "1:78775217030:web:ae61048d08d156f3e51a07"
         };
         
         const app = initializeApp(firebaseConfig);
         const db = getFirestore(app);
         window.guestbookDB = db;
         window.firebaseFns = { collection, addDoc, getDocs, serverTimestamp, query, orderBy };
      </script>
   </body>
</html>
