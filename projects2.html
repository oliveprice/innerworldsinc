<script>
  document.querySelectorAll('.piece:not(.open)').forEach(card => {
    let raf = null;

    function setTilt(e) {
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;

      // normalize to [-1, 1]
      const nx = (x / r.width) * 2 - 1;
      const ny = (y / r.height) * 2 - 1;

      // max tilt in degrees (tweak to taste)
      const MAX = 10;

      // rotateY follows x, rotateX follows y (invert X for natural feel)
      const ry = (nx * MAX).toFixed(2) + 'deg';
      const rx = (-ny * MAX).toFixed(2) + 'deg';

      card.style.setProperty('--rx', rx);
      card.style.setProperty('--ry', ry);
    }

    function onMove(e) {
      card.classList.add('is-animating');
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => setTilt(e));
    }

    function onLeave() {
      card.classList.remove('is-animating');
      card.style.setProperty('--rx', '0deg');
      card.style.setProperty('--ry', '0deg');
    }

    card.addEventListener('pointermove', onMove);
    card.addEventListener('pointerleave', onLeave);
  });
</script>
